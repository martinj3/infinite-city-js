<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buildings Test</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="bldg-canvas"></canvas>
<script src="constants.js"></script>
<script src="drawUtils.js"></script>
<script src="buildings.js"></script>
<script src="lighting.js"></script>
<script src="render3d.js"></script>
<script>
const canvas = document.getElementById('bldg-canvas');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

// Generate a grid of houses, one per lot
const GRID = 11;
const LOT_WIDTH = 70;   // feet along the street
const LOT_DEPTH = 70;   // feet away from the street
const SETBACK = 20;     // feet from the street edge of the lot to the house
const CELL = 80;        // feet between lot origins (leaves a gap between lots)
const buildings = [];
let camX = CELL * (GRID - 1) / 2;
let camY = CELL * (GRID - 1) / 2;
const CAM_SPEED = 120; // feet per second

const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? ZOOM_WHEEL : 1 / ZOOM_WHEEL;
    PX_PER_FT = Math.max(PX_PER_FT_MIN, Math.min(PX_PER_FT_MAX, PX_PER_FT * factor));
}, { passive: false });

for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
        const house = generateHouse(Math.PI, LOT_WIDTH, LOT_DEPTH, SETBACK);
        house.ox = col * CELL;
        house.oy = row * CELL;
        buildings.push(house);
    }
}

let lastTime = 0;

function update(dt) {
    // Arrow keys move in world space, accounting for the isometric rotation
    // so that pressing "up" moves the camera visually upward on screen
    const cos = getCosV(), sin = getSinV();
    let dx = 0, dy = 0;
    if (keys['ArrowUp'])    { dx -= sin; dy -= cos; }
    if (keys['ArrowDown'])  { dx += sin; dy += cos; }
    if (keys['ArrowLeft'])  { dx -= cos; dy += sin; }
    if (keys['ArrowRight']) { dx += cos; dy -= sin; }
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len > 0) {
        camX += (dx / len) * CAM_SPEED * dt;
        camY += (dy / len) * CAM_SPEED * dt;
    }

    if (keys['='] || keys['+']) PX_PER_FT = Math.min(PX_PER_FT_MAX, PX_PER_FT * Math.pow(ZOOM_SPEED, dt));
    if (keys['-'] || keys['_']) PX_PER_FT = Math.max(PX_PER_FT_MIN, PX_PER_FT / Math.pow(ZOOM_SPEED, dt));

    // View rotation (Q/E keys)
    if (keys['q'] || keys['Q']) VIEW_ANGLE -= ROTATE_SPEED * dt;
    if (keys['e'] || keys['E']) VIEW_ANGLE += ROTATE_SPEED * dt;

    // View tilt (R/F keys)
    if (keys['r'] || keys['R']) Y_SCALE = Math.min(Y_SCALE_MAX, Y_SCALE + TILT_SPEED * dt);
    if (keys['f'] || keys['F']) Y_SCALE = Math.max(Y_SCALE_MIN, Y_SCALE - TILT_SPEED * dt);
}

function render() {
    ctx.fillStyle = '#2d8a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const pAndD = (polys, ox, oy) => projectAndDraw(polys, ox, oy, camX, camY);
    const pDepth = (poly, ox, oy) => polyDepth(poly, ox, oy, camX, camY);

    // Sort buildings far-to-near by projected screen Y
    const sorted = buildings.slice().sort((a, b) => {
        const [, ay] = project(a.ox, a.oy, 0, camX, camY);
        const [, by] = project(b.ox, b.oy, 0, camX, camY);
        return ay - by;
    });

    for (const bldg of sorted) {
        drawDrawableTree(bldg, bldg.ox, bldg.oy, pAndD, pDepth);
    }
}

function loop(time) {
    const dt = lastTime ? (time - lastTime) / 1000 : 0;
    lastTime = time;
    update(dt);
    render();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
